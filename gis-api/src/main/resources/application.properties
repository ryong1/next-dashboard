spring.application.name=gis-api
server.port=8080

# DB 접속 정보. 비밀번호는 커밋하지 않는 local.properties(또는 DB_PASSWORD 환경 변수)에 둔다.
spring.config.import=optional:file:./local.properties
spring.datasource.url=jdbc:postgresql://localhost:5432/gisdb
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# 시작할 때 schema.sql 실행 (IF NOT EXISTS라 여러 번 실행해도 안전)
spring.sql.init.mode=always

# 로그: 콘솔은 Windows 터미널 기본 인코딩(MS949)을 그대로 쓰고,
# 파일은 UTF-8로 남겨 편집기/도구에서 한글이 깨지지 않게 한다
logging.file.name=logs/gis-api.log
logging.charset.file=UTF-8
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
